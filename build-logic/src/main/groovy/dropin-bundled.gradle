// Libraries that end up inside the mod jar. Applied by every module and by the root project (merged jar).
// Not transitive: Minecraft already ships netty, gson, slf4j and JNA.

repositories {
    mavenCentral()
    maven { name = 'Fabric'; url = uri('https://maven.fabricmc.net') }
    // Upstream e4mc's libraries (netty-quic build, iroh-java, kaleido-config)
    maven { url = uri('https://repo.sleeping.town/') }
    maven { url = uri('https://maven.is-quite.gay/') }
}

configurations {
    bundled {
        canBeResolved = true
        canBeConsumed = false
        transitive = false
    }
}

dependencies {
    bundled("io.netty.incubator:netty-incubator-codec-classes-quic:${quic_version}") { transitive = false }
    bundled("folk.sisby:kaleido-config:${kaleido_version}") { transitive = false }
    bundled("link.e4mc:iroh-java:${iroh_java_version}") { transitive = false }
    bundled("dev.dirs:directories:${dirs_version}") { transitive = false }
}
