plugins {
    id 'multiloader-common'
}

configurations {
    commonJava {
        canBeResolved = true
    }
    commonResources {
        canBeResolved = true
    }
}

dependencies {
    compileOnly(project(':common')) {
        def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
        attributes {
            attribute(loaderAttribute, 'common')
        }
    }
    commonJava(project(path: ':common', configuration: 'commonJava'))
    commonResources(project(path: ':common', configuration: 'commonResources'))
}

tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

processResources {
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

// Compiled classes and processed resources, consumed by the root project's merged mod jar.
configurations {
    modContents {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    modContents(sourceSets.main.java.classesDirectory) { builtBy tasks.named('compileJava') }
    modContents(tasks.named('processResources').map { it.destinationDir }) { builtBy tasks.named('processResources') }
}

// The only distributable is the merged jar in the root build/libs; keep loader jars out of the way.
tasks.named('jar', Jar) {
    archiveClassifier = 'loader-only'
    destinationDirectory = layout.buildDirectory.dir('loader-libs')
}
