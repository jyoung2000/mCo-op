plugins {
    id 'multiloader-common'
}

configurations {
    commonJava {
        canBeResolved = true
    }
    commonResources {
        canBeResolved = true
    }
}

dependencies {
    // tunnel and mc are compiled against vanilla (NeoForm); their sources are compiled again here against this loader.
    [':tunnel', ':mc'].each { path ->
        compileOnly(project(path)) {
            def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
            attributes {
                attribute(loaderAttribute, 'common')
            }
        }
    }
    [':core', ':tunnel', ':mc'].each { path ->
        commonJava(project(path: path, configuration: 'commonJava'))
        commonResources(project(path: path, configuration: 'commonResources'))
    }
}

tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

processResources {
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

// Compiled classes and processed resources, consumed by the root project's merged mod jar.
configurations {
    modContents {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    modContents(sourceSets.main.java.classesDirectory) { builtBy tasks.named('compileJava') }
    modContents(tasks.named('processResources').map { it.destinationDir }) { builtBy tasks.named('processResources') }
}

// The only distributable is the merged jar in the root build/libs; keep loader jars out of the way.
tasks.named('jar', Jar) {
    archiveClassifier = 'loader-only'
    destinationDirectory = layout.buildDirectory.dir('loader-libs')
}

// Test mods for the m2b self-tests (MILESTONES M2b): tiny jars built by the test build only, one set per loader,
// written to <root>/build/testmods/<loader>/dropin-testmod-<x|y|z>.jar. X and Y each add one item; Z adds nothing and
// only sets the system property dropin.testmod.z. They are generated here so that no loader build sees them as sources.
def testmodNames = ['x', 'y', 'z']
def testmodSrc = layout.buildDirectory.dir('testmods-src')
def testmodLoader = project.name
def generateTestmods = tasks.register('generateTestmods') {
    inputs.property('loader', testmodLoader)
    inputs.property('revision', 2)
    outputs.dir(testmodSrc)
    doLast {
        def out = testmodSrc.get().asFile
        project.delete(out)
        testmodNames.each { String n ->
            def id = "dropin_testmod_${n}"
            def cls = "TestMod${n.toUpperCase()}"
            def itemImports = '''import net.minecraft.core.Registry;
import net.minecraft.core.registries.BuiltInRegistries;
import net.minecraft.core.registries.Registries;
import net.minecraft.resources.ResourceLocation;
import net.minecraft.resources.ResourceKey;
import net.minecraft.world.item.Item;
'''
            def key = "ResourceKey<Item> key = ResourceKey.create(Registries.ITEM, ResourceLocation.fromNamespaceAndPath(\"${id}\", \"item\"));"
            def java
            if (testmodLoader == 'fabric') {
                def body = n == 'z' ? 'System.setProperty("dropin.testmod.z", "loaded");'
                        : "${key}\n        Registry.register(BuiltInRegistries.ITEM, key, new Item(new Item.Properties()));"
                java = """package dropin.testmod.${n};

${itemImports}
public final class ${cls} implements net.fabricmc.api.ModInitializer {
    @Override
    public void onInitialize() {
        ${body}
    }
}
"""
            } else {
                def body = n == 'z' ? 'System.setProperty("dropin.testmod.z", "loaded");'
                        : "${key}\n        bus.addListener(net.neoforged.neoforge.registries.RegisterEvent.class, event ->\n                event.register(Registries.ITEM, key.location(), () -> new Item(new Item.Properties())));"
                java = """package dropin.testmod.${n};

${itemImports}
@net.neoforged.fml.common.Mod("${id}")
public final class ${cls} {
    public ${cls}(net.neoforged.bus.api.IEventBus bus) {
        ${body}
    }
}
"""
            }
            def javaFile = new File(out, "java/dropin/testmod/${n}/${cls}.java")
            javaFile.parentFile.mkdirs()
            javaFile.setText(java, 'UTF-8')
            if (testmodLoader == 'fabric') {
                def meta = new File(out, "meta/${n}/fabric.mod.json")
                meta.parentFile.mkdirs()
                meta.setText("""{
  "schemaVersion": 1,
  "id": "${id}",
  "version": "1.0.0",
  "name": "DropIn test mod ${n.toUpperCase()}",
  "environment": "*",
  "entrypoints": { "main": ["dropin.testmod.${n}.${cls}"] }
}
""", 'UTF-8')
            } else {
                def meta = new File(out, "meta/${n}/META-INF/neoforge.mods.toml")
                meta.parentFile.mkdirs()
                meta.setText("""modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"

[[mods]]
modId = "${id}"
version = "1.0.0"
displayName = "DropIn test mod ${n.toUpperCase()}"
""", 'UTF-8')
            }
        }
    }
}
def compileTestmods = tasks.register('compileTestmods', JavaCompile) {
    dependsOn(generateTestmods)
    source(testmodSrc.map { it.dir('java') })
    classpath = sourceSets.main.compileClasspath
    // The game's Java, not Gradle's: the test mods are loaded by the dev client
    options.release = (project.property('java_version') as String).toInteger()
    destinationDirectory = layout.buildDirectory.dir('testmods-classes')
}
def testmodJarTasks = testmodNames.collect { String n ->
    tasks.register("testmod${n.toUpperCase()}Jar", Jar) {
        dependsOn(compileTestmods)
        archiveFileName = "dropin-testmod-${n}.jar"
        destinationDirectory = rootProject.layout.buildDirectory.dir("testmods/${testmodLoader}")
        from(layout.buildDirectory.dir('testmods-classes')) { include "dropin/testmod/${n}/**" }
        from(testmodSrc.map { it.dir("meta/${n}") })
    }
}
tasks.register('testmodJars') {
    dependsOn(testmodJarTasks)
}

// Self-test run tasks (DESIGN 4.12): runClientA / runClientB / runClientC, one game folder each under <root>/run.
// scripts/selftest.ps1 passes the scenario with -Pdropin.selftest=<scenario>:<role> and friends; they become
// -Ddropin.selftest / -Ddropin.dev.* on the game JVM, which only a development environment honours.
ext.selftestSlots = ['a', 'b', 'c']
ext.selftestProgramArgs = { String slot ->
    ['--username', "Dev${slot.toUpperCase()}".toString(), '--width', '480', '--height', '320']
}
ext.selftestSystemProps = { ->
    def props = ['dropin.dev.offlineLan': 'true',
                 'dropin.dev.testModsDir': rootProject.layout.buildDirectory.dir('testmods').get().asFile.path.replace('\\', '/')]
    if (project.hasProperty('dropin.selftest')) props['dropin.selftest'] = project.property('dropin.selftest').toString()
    if (project.hasProperty('dropin.lanPort')) props['dropin.dev.lanPort'] = project.property('dropin.lanPort').toString()
    if (project.hasProperty('dropin.sharedDir')) props['dropin.dev.sharedDir'] = project.property('dropin.sharedDir').toString().replace('\\', '/')
    if (project.hasProperty('dropin.online')) props['dropin.dev.online'] = project.property('dropin.online').toString()
    if (project.hasProperty('dropin.foreignLan')) props['dropin.dev.foreignLan'] = project.property('dropin.foreignLan').toString()
    if (project.hasProperty('dropin.selftestTimeoutSec')) props['dropin.dev.selftestTimeoutSec'] = project.property('dropin.selftestTimeoutSec').toString()
    return props
}
