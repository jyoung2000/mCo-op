import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

plugins {
    id 'base'
    id 'dropin-bundled'
    id 'com.gradleup.shadow' version '9.6.1' apply false
}

configurations {
    cleanroomContents { canBeResolved = true; canBeConsumed = false; transitive = false }
    coreContents { canBeResolved = true; canBeConsumed = false; transitive = false }
}

dependencies {
    coreContents project(':core')
}

evaluationDependsOn(':cleanroom')

// One jar (DESIGN section 5): the reobfuscated (SRG) Cleanroom jar, core/, and the bundled libraries.
// netty-quic is not flattened in: it is nested as dropin/libs/netty-quic.jar (see cleanroom/build.gradle).
def reobf = project(':cleanroom').tasks.named('reobfJar')
def coreContents = configurations.coreContents
def bundledContents = configurations.bundled
def modJar = tasks.register('modJar', ShadowJar) {
    group = 'build'
    description = 'Builds the single mod jar for Cleanroom (Minecraft 1.12.2).'
    dependsOn(reobf, coreContents)
    // The released file is named after the mod's public name; the mod id stays "dropin".
    archiveFileName = "MCo-op-${project.version}+mc${minecraft_version}.jar"
    destinationDirectory = layout.buildDirectory.dir('libs')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from({ zipTree(reobf.get().outputs.files.singleFile) })
    from(rootProject.file('LICENSE')) { rename { "LICENSE_${mod_id}" } }

    configurations.set([coreContents, bundledContents])
    dependencies {
        exclude(dependency('io.netty.incubator:netty-incubator-codec-classes-quic'))
    }
    // Relocated. iroh-java is NOT relocated: its prebuilt JNI natives bind to the original class names (session-notes.md).
    relocate 'dev.dirs', "${shadow_package}.dirs"
    relocate 'folk.sisby.kaleido', "${shadow_package}.kaleido"
    mergeServiceFiles()

    // Metadata of the bundled libraries that must not leak into our jar; keep our own manifest (MixinConfigs).
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    exclude 'META-INF/maven/**', 'META-INF/versions/**', 'module-info.class'
    // Development-only self-test driver (DESIGN 4.12) never ships
    exclude 'dropin/mc/selftest/**'
    exclude 'META-INF/INDEX.LIST', 'META-INF/native-image/**'

    manifest {
        attributes([
                'MixinConfigs'          : 'dropin.mixins.json',
                'Specification-Title'   : mod_name,
                'Specification-Version' : project.version,
                'Implementation-Title'  : mod_id,
                'Implementation-Version': project.version,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

tasks.named('assemble') { dependsOn modJar }
tasks.named('build') { dependsOn project(':core').tasks.named('build'), project(':cleanroom').tasks.named('build') }
