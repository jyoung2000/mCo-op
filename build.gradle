import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

plugins {
    id 'base'
    id 'dropin-bundled'
    // see https://maven.fabricmc.net/fabric-loom/fabric-loom.gradle.plugin/maven-metadata.xml for new versions
    id 'net.fabricmc.fabric-loom-remap' version '1.18.1' apply false
    // see https://projects.neoforged.net/neoforged/moddevgradle for new versions
    id 'net.neoforged.moddev' version '2.0.147' apply false
    id 'net.neoforged.moddev.legacyforge' version '2.0.147' apply false
    id 'com.gradleup.shadow' version '9.6.1' apply false
}

configurations {
    fabricContents { canBeResolved = true; canBeConsumed = false }
    forgeContents { canBeResolved = true; canBeConsumed = false }
}

dependencies {
    // Fabric: the remapped (intermediary) loader jar. Forge: the reobfuscated (SRG) loader jar.
    fabricContents project(path: ':fabric', configuration: 'remappedContents')
    forgeContents project(path: ':forge', configuration: 'reobfContents')
}

// One jar for both loaders (DESIGN section 5). 1.20.1 is obfuscated: Fabric runs intermediary names and Forge SRG
// names, so the two loaders cannot share Minecraft-facing classes as they do on 26.x. The Forge copy of mc/, the
// mixins and the tunnel is relocated to dropin.fg.* with its own mixin config and refmap; core/ (no Minecraft
// references) and the resources are shared. Only one copy is ever loaded: the one of the running loader.
def forgeJar = project.configurations.forgeContents
def forgeRelocated = tasks.register('forgeRelocatedJar', ShadowJar) {
    group = 'build'
    description = 'Forge classes of the mod jar, relocated so they sit next to the Fabric copy.'
    dependsOn(forgeJar)
    archiveFileName = 'forge-relocated.jar'
    destinationDirectory = layout.buildDirectory.dir('tmp/merge')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from({ forgeJar.collect { zipTree(it) } })
    configurations = []
    exclude 'dropin/core/**', 'dropin/mc/selftest/**', 'fabric.mod.json', 'dropin.mixins.json', 'assets/**', 'LICENSE*',
            'META-INF/MANIFEST.MF'
    relocate 'dropin.mc', 'dropin.fg.mc'
    relocate 'dropin.mixin', 'dropin.fg.mixin'
    relocate 'dropin.tunnel', 'dropin.fg.tunnel'
    // The Forge mixin config and refmap (generated by :forge): relocated package, plugin and mixin class names.
    filesMatching(['dropin.forge.mixins.json', 'dropin.forge.refmap.json']) {
        filter { String line ->
            line.replace('"package": "dropin.mixin"', '"package": "dropin.fg.mixin"')
                .replace('"plugin": "dropin.mc.DropInMixinPlugin"', '"plugin": "dropin.fg.mc.DropInMixinPlugin"')
                .replace('dropin/mixin/', 'dropin/fg/mixin/')
        }
    }
}

def fabricJar = project.configurations.fabricContents
def modJar = tasks.register('modJar', ShadowJar) {
    group = 'build'
    description = 'Builds the single mod jar that loads on Fabric and NeoForge.'
    dependsOn(forgeRelocated, fabricJar)
    // The released file is named after the mod's public name; the mod id stays "dropin".
    archiveFileName = "MCo-op-${project.version}+mc${minecraft_version}.jar"
    destinationDirectory = layout.buildDirectory.dir('libs')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from({ fabricJar.collect { zipTree(it) } })
    from({ zipTree(forgeRelocated.get().archiveFile) })
    from(rootProject.file('LICENSE')) { rename { "LICENSE_${mod_id}" } }

    configurations = [project.configurations.bundled]
    // Relocated. netty-quic and iroh-java are NOT relocated: their prebuilt JNI natives bind to the
    // original class names (see session-notes.md).
    relocate 'dev.dirs', "${shadow_package}.dirs"
    relocate 'folk.sisby.kaleido', "${shadow_package}.kaleido"
    mergeServiceFiles()

    // Metadata of the bundled libraries that must not leak into our jar
    exclude 'META-INF/MANIFEST.MF', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    exclude 'META-INF/maven/**', 'META-INF/versions/**', 'module-info.class'
    // Development-only self-test driver (DESIGN 4.12) never ships
    exclude 'dropin/mc/selftest/**', 'dropin/fg/mc/selftest/**'
    // META-INF/mods.toml is Forge's metadata here; META-INF/jarjar holds Forge's nested MixinExtras.
    exclude 'quilt.mod.json', 'META-INF/jars/**', 'META-INF/INDEX.LIST', 'META-INF/native-image/**'

    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Version' : project.version,
                'Implementation-Title'  : mod_id,
                'Implementation-Version': project.version,
                'Built-On-Minecraft'    : minecraft_version,
                // Forge 1.20.1 reads mixin configs from the manifest; Fabric reads them from fabric.mod.json.
                'MixinConfigs'          : 'dropin.forge.mixins.json'
        ])
    }
}

tasks.named('assemble') { dependsOn modJar }
