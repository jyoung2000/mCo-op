// Pure Java. No Minecraft, Fabric or NeoForge on the classpath, so an import of them cannot compile here.
plugins {
    id 'java-library'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
}

repositories {
    mavenCentral()
}

dependencies {
    // Gson ships with Minecraft, so the mod does not bundle it; core only compiles against it.
    compileOnly 'com.google.code.gson:gson:2.11.0'
    testImplementation 'com.google.code.gson:gson:2.11.0'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    // Opt-in tests that talk to public pkarr relays: ./gradlew :core:test -Pdropin.online=true
    systemProperty 'dropin.online', providers.gradleProperty('dropin.online').getOrElse('false')
}

// The loader modules compile these sources into the mod (see build-logic/multiloader-loader.gradle).
configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}
