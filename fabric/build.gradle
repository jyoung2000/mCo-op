plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom-remap'
}
dependencies {
    minecraft("com.mojang:minecraft:${minecraft_version}")
    mappings(loom.officialMojangMappings())
    modImplementation("net.fabricmc:fabric-loader:${fabric_loader_version}")
    modImplementation("net.fabricmc.fabric-api:fabric-api:${fabric_version}")
    runtimeOnly(files(configurations.bundled))
}

loom {
    def aw = project(':mc').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
        selftestSlots.each { slot ->
            create("client${slot.toUpperCase()}") {
                client()
                setConfigName("Fabric Self-test ${slot.toUpperCase()}")
                ideConfigGenerated(false)
                runDir("../run/${slot}")
                programArgs(selftestProgramArgs(slot))
                selftestSystemProps().each { k, v -> vmArg("-D${k}=${v}") }
            }
        }
    }
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}

// The remapped (intermediary) jar: the Fabric part of the merged mod jar (1.21.1 is obfuscated, see root build.gradle).
configurations {
    remappedContents {
        canBeResolved = false
        canBeConsumed = true
    }
}
artifacts {
    remappedContents(tasks.named('remapJar'))
}
