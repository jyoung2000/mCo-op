modLoader = "javafml"
loaderVersion = "${forge_loader_version_range}"
license = "${license}"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
logoFile = "dropin_icon.png"
credits = "${credits}"
authors = "${mod_author}"
description = '''
${description}
'''

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "[47.4,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# DropIn contains the e4mc tunnel: both mods would mixin the same targets and open two relay sessions.
[[dependencies.${mod_id}]]
modId = "e4mc"
mandatory = false
versionRange = "[0,0)"
ordering = "NONE"
side = "BOTH"
