# Project
version=0.1.0
group=dropin
# Java release core/ and the mod are compiled for (Cleanroom 0.7.x itself runs on Java 25)
java_version=21

# Common
minecraft_version=1.12.2
mod_name=MCo-op
mod_author=jyoung2000, skyevg (e4mc)
mod_id=dropin
license=MIT
credits=Built on e4mc by Skye (MIT)
description=Turns a singleplayer world into a drop-in co-op world shared between friends.

# Cleanroom Loader (Forge 1.12.2 fork, Java 25). Releases: https://github.com/CleanroomMC/Cleanroom/releases
cleanroom_version=0.7.16-alpha
# Mixin reference map written by the annotation processor (MCP -> SRG), read by Mixin in the production jar
cg.userdev.refmap=dropin.refmap.json

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# Bundled libraries (upstream e4mc)
quic_version=0.0.74.Final.e4mc.1
iroh_java_version=0.1.2
dirs_version=26
kaleido_version=0.3.3+1.3.2
shadow_package=dropin.shadow
