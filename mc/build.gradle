// Minecraft-facing DropIn code, compiled here against vanilla (NeoForm) and again inside each loader module.
plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

sourceSets {
    // Development-only scripted driver (DESIGN 4.12). Compiled into dev runs, never into the mod jar.
    selftest
}

neoForge {
    neoFormVersion = neo_form_version
    addModdingDependenciesTo(sourceSets.selftest)
}

configurations {
    selftestCompileOnly.extendsFrom compileOnly
    selftestImplementation.extendsFrom implementation
}

dependencies {
    compileOnly('net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7')
    compileOnly(annotationProcessor('io.github.llamalad7:mixinextras-common:0.5.3'))
    implementation(project(':core'))
    implementation(project(':tunnel'))

    selftestImplementation(sourceSets.main.output)

    testImplementation(sourceSets.selftest.output)
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

// The loader modules compile these sources into the mod (see build-logic/multiloader-loader.gradle).
configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava file('src/main/java')
    commonJava file('src/selftest/java')
    commonResources file('src/main/resources')
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'common')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'common')
            }
        }
    }
}
