plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':mc').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
            gameDirectory = this.mkdir(this.file('runs/client'))
        }
        server {
            server()
            this.file('runs/server').createParentDirectories()
            gameDirectory = this.mkdir(this.file('runs/server'))
        }
        selftestSlots.each { slot ->
            create("client${slot.toUpperCase()}") {
                client()
                gameDirectory = this.mkdir(rootProject.file("run/${slot}"))
                programArguments.addAll(selftestProgramArgs(slot))
                selftestSystemProps().each { k, v -> systemProperty(k, v) }
            }
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // Bundled libraries, needed on the dev-run classpath
    runtimeOnly(files(configurations.bundled))
    // NeoForge 1.21.1 (FML 4) only shows plain library jars to the mod through the game's legacy class path
    additionalRuntimeClasspath(files(configurations.bundled))
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'neoforge')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName, it.getTaskName(null, 'jarJar')].each { variant ->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'neoforge')
            }
        }
    }
}

// NeoForge's mixin config: the shared dropin.mixins.json under its own name, so that the merged jar can carry a
// relocated copy of it next to Fabric's (see root build.gradle). In development it points at the plain classes.
processResources {
    from(project(':mc').file('src/main/resources/dropin.mixins.json')) {
        rename { 'dropin.neoforge.mixins.json' }
    }
}
