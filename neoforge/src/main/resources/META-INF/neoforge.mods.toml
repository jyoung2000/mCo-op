modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
license = "${license}"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
logoFile = "dropin_icon.png"
credits = "${credits}"
authors = "${mod_author}"
description = '''
${description}
'''

[[mixins]]
config = "dropin.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# DropIn contains the e4mc tunnel: both mods would mixin the same targets and open two relay sessions.
[[dependencies.${mod_id}]]
modId = "e4mc"
type = "incompatible"
versionRange = "*"
ordering = "NONE"
side = "BOTH"
